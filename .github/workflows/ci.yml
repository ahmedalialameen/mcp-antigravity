name: CI

on:
  push:
    branches: [main, "feat*"]
  pull_request:
    branches: [main, "feat*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
